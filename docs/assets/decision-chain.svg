<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clustr decision chain</title>
  <desc id="desc">Trading intent passes through evidence, risk, approval, exchange execution, and Session Tape</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11101F"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="rail" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7E6DEA"/>
      <stop offset="0.72" stop-color="#A99AFF"/>
      <stop offset="1" stop-color="#5ED3A2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="218" rx="26" fill="url(#bg)" stroke="#A99AFF" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M106 86H1094" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
