    <g transform="translate(304 86)"><circle r="27" fill="#1B1732" stroke="#9F8CFF" stroke-width="2"/><path d="M-9 8V-2L0-10L9-2V8Z" stroke="#DCD6FF" stroke-width="2"/><text y="58" fill="#F6F3FF" font-size="15" font-weight="650">Evidence</text><text y="79" fill="#817B91" font-size="11">market + account</text></g>
    <g transform="translate(502 86)"><circle r="27" fill="#1B1732" stroke="#9F8CFF" stroke-width="2"/><path d="M0-11L10-7V1C10 7 6 11 0 14C-6 11-10 7-10 1V-7Z" stroke="#DCD6FF" stroke-width="2"/><text y="58" fill="#F6F3FF" font-size="15" font-weight="650">Risk Kernel</text><text y="79" fill="#817B91" font-size="11">deterministic permit</text></g>
